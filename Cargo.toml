[package]
name = "deskorg"
version = "1.1.1"
edition = "2021"
rust-version = "1.95"
description = "DeskOrg - 桌面整理、桌面框框与美化工具"
authors = ["白起"]
license = "MIT"
repository = "https://github.com/BenTaotao/deskorg"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "gif"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[profile.dev]
opt-level = 1
